<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Original Paraguayan Footwear</title>
    <style>
        :root {
            --red: #D52B1E;
            --blue: #0038A8;
            --white: #FFFFFF;
            --light-gray: #F7F7F7;
            --gray: #E8E8E8;
            --text: #222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #fff5f5 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 56, 168, 0.12);
            overflow: hidden;
        }

        /* Header inspired by the Paraguayan flag */
        .header {
            background: linear-gradient(90deg, var(--red) 0%, var(--red) 33%, white 33%, white 66%, var(--blue) 66%);
            padding: 28px 30px;
            text-align: center;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--red), white, var(--blue));
        }

        .header h1 {
            color: white;
            font-size: 1.9rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .header p {
            color: rgba(255,255,255,0.95);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .content {
            padding: 30px;
        }

        /* Form */
        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 35px;
            background: var(--light-gray);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--gray);
        }

        input {
            padding: 13px 16px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--blue);
        }

        button {
            padding: 13px 22px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background: var(--blue);
            color: white;
        }

        .btn-add:hover {
            background: #002a80;
            transform: translateY(-1px);
        }

        h2 {
            font-size: 1.35rem;
            margin-bottom: 18px;
            color: var(--blue);
        }

        /* Product grid */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .product {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
        }

        .product.affordable {
            border-left: 6px solid #2e7d32;
        }

        .product.premium {
            border-left: 6px solid var(--red);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #f0f0f0;
        }

        .product-info {
            padding: 16px 18px 18px;
        }

        .product h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #111;
        }

        .product p {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 4px;
        }

        .price {
            font-size: 1.3rem !important;
            font-weight: 700;
            margin: 10px 0 14px !important;
        }

        .affordable .price {
            color: #2e7d32;
        }

        .premium .price {
            color: var(--red);
        }

        .delete {
            background: #c62828;
            color: white;
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }

        .delete:hover {
            background: #a01818;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            z-index: 2;
        }

        .affordable .badge {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .premium .badge {
            background: #ffebee;
            color: var(--red);
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🇵🇾 Original Paraguayan Footwear</h1>
        <p>Inspired by Guaraní culture • Ñandutí • Itaipú</p>
    </div>

    <div class="content">

        <div class="form">
            <input type="text" id="name" placeholder="Shoe name">
            <input type="text" id="brand" placeholder="Brand">
            <input type="number" id="price" placeholder="Price (USD)" min="1" step="0.01">
            <button class="btn-add" onclick="addShoe()">
                + Add Shoe
            </button>
        </div>

        <h2>📦 Paraguayan Collection</h2>

        <div id="productList" class="products"></div>

    </div>
</div>

<script>
    // Original Paraguay-inspired products with real shoe images
    let shoes = [
        {
            name: "Ñandutí Runner",
            brand: "Guarani Steps",
            price: 189.90,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&h=400&fit=crop"
        },
        {
            name: "Asunción Urban",
            brand: "Itaipú Wear",
            price: 349.00,
            image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500&h=400&fit=crop"
        },
        {
            name: "Yerba Mate Trek",
            brand: "Chaco Original",
            price: 279.50,
            image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500&h=400&fit=crop"
        },
        {
            name: "Sol de Encarnación",
            brand: "Paraguay Heritage",
            price: 899.00,
            image: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500&h=400&fit=crop"
        },
        {
            name: "Río Paraná Classic",
            brand: "Guarani Steps",
            price: 459.90,
            image: "https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=500&h=400&fit=crop"
        },
        {
            name: "Luque Elite",
            brand: "Ñeembucú Atelier",
            price: 1250.00,
            image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500&h=400&fit=crop"
        }
    ];

    function addShoe() {
        const name = document.getElementById("name").value.trim();
        const brand = document.getElementById("brand").value.trim();
        const price = Number(document.getElementById("price").value);

        if (!name || !brand || price <= 0) {
            alert("Please fill in all fields correctly!");
            return;
        }

        // Default image for new shoes
        const defaultImage = "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500&h=400&fit=crop";

        shoes.push({ name, brand, price, image: defaultImage });
        clearFields();
        renderShoes();
    }

    function renderShoes() {
        const list = document.getElementById("productList");
        list.innerHTML = "";

        shoes.forEach((shoe, index) => {
            const type = shoe.price < 500 ? "affordable" : "premium";
            const badge = shoe.price < 500 ? "Affordable" : "Premium";

            list.innerHTML += `
                <div class="product ${type}">
                    <span class="badge">${badge}</span>
                    <img src="\( {shoe.image}" alt=" \){shoe.name}" loading="lazy">
                    <div class="product-info">
                        <h3>${shoe.name}</h3>
                        <p><strong>Brand:</strong> ${shoe.brand}</p>
                        <p class="price">
                            $${shoe.price.toLocaleString("en-US", {
                                minimumFractionDigits: 2
                            })}
                        </p>
                        <button class="delete" onclick="deleteShoe(${index})">
                            Delete
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function deleteShoe(index) {
        shoes.splice(index, 1);
        renderShoes();
    }

    function clearFields() {
        document.getElementById("name").value = "";
        document.getElementById("brand").value = "";
        document.getElementById("price").value = "";
    }

    // Load on page start
    renderShoes();
</script>

</body>
</html>
